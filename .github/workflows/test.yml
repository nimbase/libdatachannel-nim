name: test
on:
  push:
    paths-ignore:
      - LICENSE
      - README.*
  pull_request:
    paths-ignore:
      - LICENSE
      - README.*
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test.yml@main
    with:
      nim-version: stable
      os: '[{"os":"ubuntu-latest"},{"os":"macos-latest"}]'
      # Build and install the native libdatachannel v0.24.6 that the
      # bindings target. ARC needs no flag: tests/config.nims pins
      # switch("mm", "arc"), which `nimble test` picks up on every OS.
      pre-install-command: |
        # Submodule mode (PREFER_SYSTEM_LIB=OFF, the default) on every OS:
        # only a toolchain, git, cmake and OpenSSL are required.
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libssl-dev
        else
          command -v cmake >/dev/null || brew install cmake
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
        fi
        git clone --depth 1 --recurse-submodules --branch v0.24.6 \
          https://github.com/paullouisageneau/libdatachannel.git \
          "$RUNNER_TEMP/libdatachannel"
        cmake -S "$RUNNER_TEMP/libdatachannel" \
          -B "$RUNNER_TEMP/libdatachannel/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DUSE_GTEST=OFF \
          -DBUILD_SHARED_LIBS=ON
        cmake --build "$RUNNER_TEMP/libdatachannel/build" --parallel
        sudo cmake --install "$RUNNER_TEMP/libdatachannel/build"

  examples:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and install libdatachannel
        run: |
          # Submodule mode (PREFER_SYSTEM_LIB=OFF, the default) on every OS:
          # only a toolchain, git, cmake and OpenSSL are required.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake git libssl-dev
          else
            command -v cmake >/dev/null || brew install cmake
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          fi
          git clone --depth 1 --recurse-submodules --branch v0.24.6 \
            https://github.com/paullouisageneau/libdatachannel.git \
            "$RUNNER_TEMP/libdatachannel"
          cmake -S "$RUNNER_TEMP/libdatachannel" \
            -B "$RUNNER_TEMP/libdatachannel/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_GTEST=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/libdatachannel/build" --parallel
          sudo cmake --install "$RUNNER_TEMP/libdatachannel/build"

      - uses: nimbase/setup-nim-action@main
        with:
          nim-version: stable

      - run: nimble install -Y

      # The nimble task already builds every example with --mm:arc,
      # which the high-level API requires (see the README).
      - name: Build the examples
        run: nimble examples
